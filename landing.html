<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhamed Ahmed · Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        body.dark-mode {
            background: #0f0f1a;
            color: #e0e0e0;
        }
        body.dark-mode .portfolio {
            background: #1a1a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        body.dark-mode .sidebar {
            background: #16162b;
            border-right: 1px solid #2a2a4a;
        }
        body.dark-mode .nav-item {
            color: #aaaac0;
        }
        body.dark-mode .nav-item:hover,
        body.dark-mode .nav-item.active {
            background: #2a2a4a;
            color: #6ea8fe;
        }
        body.dark-mode .dark-toggle {
            background: #2a2a4a;
            border-color: #3a3a5a;
            color: #e0e0e0;
        }
        body.dark-mode .dark-toggle-wrap {
            border-top-color: #2a2a4a;
        }
        body.dark-mode .welcome-card {
            background: #1f1f3a;
            border-color: #2a2a4a;
        }
        body.dark-mode .welcome-card p {
            color: #aaaac0;
        }

        .portfolio {
            display: flex;
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            min-height: 80vh;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .sidebar {
            width: 280px;
            background: #f8f9fc;
            padding: 30px 20px;
            border-right: 1px solid #e8ecf1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .profile-pic {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
            text-align: center;
        }
        .profile-pic img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2563eb;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
            background: #dbeafe;
        }
        .profile-pic h2 {
            margin-top: 12px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .profile-pic h2 span {
            color: #2563eb;
        }
        .profile-pic .sub {
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: 2px;
        }
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #374151;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-item i {
            width: 24px;
            font-size: 1.15rem;
            color: #2563eb;
            text-align: center;
        }
        .nav-item:hover {
            background: #eef2ff;
        }
        .nav-item.active {
            background: #eef2ff;
            color: #1e293b;
            font-weight: 600;
        }
        .dark-toggle-wrap {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #e8ecf1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dark-toggle-wrap span {
            font-size: 0.85rem;
            color: #6b7280;
        }
        .dark-toggle {
            background: #f0f2f5;
            border: 1px solid #d1d5db;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .dark-toggle:hover {
            background: #e5e7eb;
        }
        .content {
            flex: 1;
            padding: 40px 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            max-height: 80vh;
        }
        .welcome-card {
            max-width: 700px;
            text-align: center;
            background: #fafbff;
            border: 1px solid #e8ecf1;
            border-radius: 20px;
            padding: 50px 40px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .welcome-card .big-icon {
            font-size: 4rem;
            color: #2563eb;
            margin-bottom: 16px;
        }
        .welcome-card h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .welcome-card h1 span {
            color: #2563eb;
        }
        .welcome-card p {
            font-size: 1.1rem;
            color: #6b7280;
            line-height: 1.7;
            margin-top: 12px;
        }
        .welcome-card .cta-buttons {
            margin-top: 28px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
            border: 2px solid #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
        }
        .btn-outline {
            background: transparent;
            color: #2563eb;
            border: 2px solid #2563eb;
        }
        .btn-outline:hover {
            background: #2563eb;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
        }

        @media (max-width: 820px) {
            .portfolio {
                flex-direction: column;
                min-height: auto;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e8ecf1;
                padding: 20px;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
            .profile-pic {
                flex-direction: row;
                gap: 16px;
                margin-bottom: 0;
                width: auto;
            }
            .profile-pic img {
                width: 64px;
                height: 64px;
            }
            .profile-pic h2 {
                margin-top: 0;
                font-size: 1.05rem;
            }
            .profile-pic .sub {
                display: none;
            }
            .nav-list {
                flex-direction: row;
                flex-wrap: wrap;
                margin-top: 0;
                gap: 4px;
            }
            .nav-item {
                padding: 6px 14px;
                font-size: 0.85rem;
            }
            .nav-item i {
                width: 18px;
                font-size: 1rem;
            }
            .dark-toggle-wrap {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
                margin-left: auto;
            }
            .content {
                padding: 30px 24px;
                max-height: none;
            }
            .welcome-card {
                padding: 30px 24px;
            }
            .welcome-card h1 {
                font-size: 1.8rem;
            }
        }
        @media (max-width: 500px) {
            .sidebar {
                flex-direction: column;
                align-items: stretch;
            }
            .profile-pic {
                flex-direction: column;
                align-items: center;
            }
            .profile-pic .sub {
                display: block;
            }
            .dark-toggle-wrap {
                margin-left: 0;
                justify-content: center;
            }
            .content {
                padding: 20px 16px;
            }
            .welcome-card {
                padding: 24px 16px;
            }
            .welcome-card h1 {
                font-size: 1.5rem;
            }
            .btn {
                padding: 10px 24px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="portfolio">
        <aside class="sidebar">
            <div class="profile-pic">
                <img src="my.jpg" alt="Muhamed Ahmed" />
                <h2><span>Muhamed</span> Ahmed</h2>
                <div class="sub">Software Developer · CS Grad</div>
            </div>
            <nav class="nav-list">
    <a class="nav-item" href="landing.html"><i class="fas fa-home"></i> Home</a>
    <a class="nav-item" href="about.html"><i class="fas fa-user"></i> About</a>
    <a class="nav-item" href="experience.html"><i class="fas fa-briefcase"></i> Experience</a>
    <a class="nav-item" href="projects.html"><i class="fas fa-code"></i> Projects</a>
    <a class="nav-item" href="skills.html"><i class="fas fa-cog"></i> Skills</a>
    <a class="nav-item" href="cv.html"><i class="fas fa-file-pdf"></i> CV</a>  <!-- ← NEW -->
    <a class="nav-item" href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
</nav>
            <div class="dark-toggle-wrap">
                <span><i class="fas fa-palette"></i> Theme</span>
                <button class="dark-toggle" id="darkToggle">
                    <i class="fas fa-moon"></i> <span>Dark</span>
                </button>
            </div>
        </aside>
        <main class="content">
            <div class="welcome-card">
                <div class="big-icon"><i class="fas fa-code"></i></div>
                <h1>Welcome to <span>My Portfolio</span></h1>
                <p>I'm <strong>Muhamed Ahmed Shifaw</strong>, a passionate Software Developer and Computer Science graduate. Explore my work, skills, and experience.</p>
                <div class="cta-buttons">
                    <a href="about.html" class="btn btn-primary"><i class="fas fa-user"></i> About Me</a>
                    <a href="projects.html" class="btn btn-outline"><i class="fas fa-code"></i> View Projects</a>
                    <a href="cv.html" class="btn btn-outline"><i class="fas fa-file-pdf"></i> View CV</a>
                </div>
            </div>
        </main>
    </div>
    <script>
        const toggle = document.getElementById('darkToggle');
        const body = document.body;
        const icon = toggle.querySelector('i');
        const label = toggle.querySelector('span');
        if (localStorage.getItem('darkMode') === 'true') {
            body.classList.add('dark-mode');
            icon.className = 'fas fa-sun';
            label.textContent = 'Light';
        }
        toggle.addEventListener('click', function() {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            label.textContent = isDark ? 'Light' : 'Dark';
        });
    </script>
</body>
</html>
